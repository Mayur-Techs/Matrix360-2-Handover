services:
  - type: web
    name: matrix360-audience-lead-engine
    env: python
    region: singapore
    plan: standard
    buildCommand: "pip install -r requirements.txt && python -m playwright install --with-deps chromium"
    startCommand: "uvicorn scraper.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MATRIX_CORS_ORIGINS
        value: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://localhost:8765,https://matrix360-crm-backend-p9os.onrender.com"
