services:
  lead-scraper:
    build: .
    container_name: lead-scraper-agent
    ports:
      - "${PORT:-8012}:${PORT:-8012}"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-8012}
      - HOST=0.0.0.0
      - LEAD_AI_API_KEY=${LEAD_AI_API_KEY:-}
      - LEAD_AI_MODEL=${LEAD_AI_MODEL:-gpt-4o-mini}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped
