name: "Mayur | Workstream CI & Functional Verification"

on:
  push:
    branches: ["work/mayur"]
    paths:
      - "workstreams/mayur/**"
      - ".github/workflows/mayur.yml"
  pull_request:
    paths:
      - "workstreams/mayur/**"
      - ".github/workflows/mayur.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "mayur-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: "Directory and filename checks"
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (read only)
        uses: actions/checkout@v4
      - name: Check workstream directory
        shell: bash
        run: |
          set -euo pipefail
          test -f "workstreams/mayur/README.md"
      - name: Reject tracked sensitive filenames in this workstream
        shell: bash
        run: |
          set -euo pipefail
          suspect="$(git ls-files -- 'workstreams/mayur/' | grep -Ei '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|.*\.(pem|p12|pfx)$|.*service[-_]?account.*\.json$)' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [[ -n "$suspect" ]]; then
            echo "::error::Suspected secret files tracked in workstream mayur. Remove them from git and rotate any exposed credentials."
            printf '%s\n' "$suspect"
            exit 1
          fi

  functional-tests:
    name: "Audience Engine Functional Unit & Integration Tests"
    runs-on: ubuntu-latest
    needs: repository-hygiene
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "workstreams/mayur/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workstreams/mayur/requirements.txt
          pip install pytest

      - name: Run verification test suite
        run: |
          cd workstreams/mayur
          python -m pytest tests/ -v
